[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"
  
[functions]
  node_bundler = "esbuild"
  included_files = ["dist/server/**"]
  external_node_modules = [
    "react",
    "react-dom",
    "react-router-dom",
    "react-helmet-async",
    "lottie-web",
    "lottie-react",
    "gsap",
    "lenis"
  ]
# Existing files in publish (assets, robots.txt, sitemap.xml) are served first.
# index.html is removed from dist/client during build so "/" hits SSR.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200

[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
